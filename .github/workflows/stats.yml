name: Update plugin stats in link preview
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update og:description
        run: |
          B=https://abacus.jasoncameron.dev/get/ejudge-clion-vmaiorov
          I=$(curl -s $B/installs | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',0))" || echo 0)
          D=$(curl -s $B/active-$(date +%F) | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',0))" || echo 0)
          python3 - "$I" "$D" <<'PY'
          import re,sys
          i,d=sys.argv[1:3]
          p='ejudge-clion/index.html'
          s=open(p,encoding='utf-8').read()
          t='Контесты Яндекс Кружка прямо в IDE: условия, тесты и отправка решений. Установок: %s, сегодня запускали: %s.'%(i,d)
          s=re.sub(r'(<meta property="og:description" content=")[^"]*',lambda m:m.group(1)+t,s)
          open(p,'w',encoding='utf-8').write(s)
          PY
          if ! git diff --quiet; then
            git config user.name "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git commit -qam "Update stats in link preview"
            git push
          fi

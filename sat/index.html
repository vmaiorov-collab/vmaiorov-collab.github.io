<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>SAT English — подготовка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
html{color-scheme:light}
:root{
  --bg:#F4F6FB;--card:#fff;--ink:#141B2D;--muted:#6B7387;--line:#E5E9F2;
  --nav:#121A2F;--nav2:#1B2542;--acc:#5B5BF0;--acc2:#12B886;--warn:#F59F00;--bad:#E8590C;
  --grad:linear-gradient(90deg,#5B5BF0 0%,#7C4DFF 45%,#12B886 100%);
  --r:18px;--sh:0 1px 2px rgba(20,27,45,.04),0 8px 24px rgba(20,27,45,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:var(--ink);-webkit-text-fill-color:currentColor}
a{color:var(--acc)}
.app{display:flex;min-height:100vh}
aside{width:236px;background:var(--nav);color:#C9D1E8;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{color:#fff;font-size:16px;display:block}.brand small{font-size:12px;color:#8A95B5}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#C9D1E8;text-decoration:none;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--nav2)}
nav a.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 #7C4DFF}
nav .ic{width:22px;text-align:center;font-size:17px}
.side-foot{margin-top:auto;font-size:12px;color:#7D88A8;padding:10px}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#7D88A8;display:inline-block}
.dot.ok{background:#12B886}.dot.loc{background:#F59F00}
main{flex:1;min-width:0;padding:28px 36px 80px;max-width:1180px}
h1{font-family:Fraunces,serif;font-size:32px;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.gmain{grid-template-columns:1.5fr 1fr;align-items:start}.gplan{grid-template-columns:1fr 300px;align-items:start}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#121A2F 0%,#26306B 60%,#3B2E8F 100%);color:#fff;border:0;padding:26px 28px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(124,77,255,.45),transparent 70%)}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.hero .date{font-family:Fraunces,serif;font-size:30px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);color:#fff}
.pill.y{background:#FFE8A3;color:#7A5300}.pill.g{background:#D3F9E8;color:#0B7A55}.pill.p{background:#E9E7FF;color:#4338CA}.pill.r{background:#FFE3D6;color:#B33F00}.pill.gr{background:#EEF1F6;color:#5A6378}
.daynav{display:flex;gap:6px;position:relative;z-index:1}
.daynav button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-weight:600}
.daynav button:hover{background:rgba(255,255,255,.22)}
.bar{height:22px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin:22px 0 8px;position:relative;z-index:1}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1);position:relative}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 2.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bar.light{background:#EEF1F6;height:12px;margin:8px 0}
.hero .meta{display:flex;justify-content:space-between;font-weight:600;position:relative;z-index:1;flex-wrap:wrap;gap:8px}
.msg{opacity:.85;font-size:14px;margin-top:4px;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.task{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;margin-bottom:10px;transition:.2s;box-shadow:var(--sh)}
.task.done{background:#F2FCF7;border-color:#BFEBD6}
.task .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.task .body{flex:1;min-width:0}
.task .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.task .txt{font-weight:600;font-size:15.5px;margin:2px 0 6px}
.task.done .txt{color:#0B7A55}
.chk{width:44px;height:44px;border-radius:13px;border:2px solid #D5DBE7;background:#fff;display:grid;place-items:center;font-size:20px;color:transparent;flex-shrink:0;transition:.2s}
.chk:hover{border-color:var(--acc)}
.task.done .chk{background:var(--acc2);border-color:var(--acc2);color:#fff;transform:scale(1.04)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#F7F8FC;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:600;background:var(--acc);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.s{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:#EEF0FF;color:var(--acc)}
.btn.green{background:var(--acc2)}
.btn:disabled{opacity:.5;cursor:default}
.mini{font-size:12.5px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:90px;resize:vertical}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.wd.sel{outline:2px solid var(--acc)}
.wd small{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase}
.wd b{font-size:16px}
.ring{width:38px;height:38px;margin:6px auto 0;display:block}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.month h3{text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .h{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700}
.cell{aspect-ratio:1;border-radius:7px;background:#EEF1F6;display:grid;place-items:center;font-size:11px;font-weight:600;color:#7A8399;cursor:pointer;border:0}
.cell.p1{background:#FFD8A8;color:#8A4B00}.cell.p2{background:#B2F2D4;color:#0B6B4A}.cell.p3{background:#12B886;color:#fff}.cell.miss{background:#FFE3E3;color:#C92A2A}
.cell.today{outline:2px solid var(--acc);outline-offset:1px}.cell.cp{box-shadow:inset 0 0 0 2px #7C4DFF}
.cell.e{background:transparent;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;margin-bottom:16px}
.tli:before{content:"";position:absolute;left:-20px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #C3CAD9}
.tli.now:before{border-color:var(--acc);background:var(--acc)}
.tli.past:before{border-color:var(--acc2);background:var(--acc2)}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.q .qt{font-weight:600;margin-bottom:10px;font-size:15.5px;line-height:1.45}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px}.sec h2{margin:0}.sec .pill{margin-left:auto}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#FAFBFE;border-radius:10px;padding:11px 14px;margin-bottom:7px;color:var(--ink);font-size:15px;font-weight:500;line-height:1.4}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:#EEF0FF}
.opt.right{border-color:#12B886;background:#E6FCF3}
.opt.wrong{border-color:#FA5252;background:#FFF0F0}
.exp{font-size:13.5px;background:#F7F8FC;border-radius:10px;padding:8px 12px;margin-top:6px}
.passage{background:#FBFAF6;border-left:4px solid #7C4DFF;border-radius:10px;padding:14px 16px;font-family:Georgia,serif;font-size:15.5px;line-height:1.65;margin-bottom:12px}
.wtable{width:100%;border-collapse:collapse}
.wtable td,.wtable th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
.wtable th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.st{border:0;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700}
.st0{background:#EEF1F6;color:#5A6378}.st1{background:#FFF3BF;color:#8A6100}.st2{background:#D3F9E8;color:#0B7A55}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:#EEF1F6;border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.flash{perspective:1000px;max-width:520px;margin:10px auto}
.fcard{min-height:260px;border-radius:22px;background:var(--grad);color:#fff;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer;box-shadow:0 18px 40px rgba(91,91,240,.3)}
.fcard.back{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left;place-items:start;box-shadow:var(--sh)}
.fcard .w{font-family:Fraunces,serif;font-size:44px;font-weight:700}
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:4px 2px 12px}
.m{max-width:82%;padding:11px 15px;border-radius:16px;margin-bottom:10px;white-space:normal}
.m.u{margin-left:auto;background:var(--acc);color:#fff;border-bottom-right-radius:6px}
.m.a{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--sh)}
.m p{margin:0 0 6px}.m p:last-child{margin:0}.m ul,.m ol{margin:4px 0 6px;padding-left:20px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:160px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(18,26,47,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.x{float:right;border:0;background:#EEF1F6;color:var(--ink);border-radius:10px;width:32px;height:32px;font-size:16px}
.md p{margin:0 0 8px}.md ul,.md ol{margin:4px 0 8px;padding-left:20px}.md h4{margin:10px 0 4px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #C9CFFB;border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:30px}
.score{font-size:42px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.links a.lk{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-decoration:none;color:var(--ink);background:#fff}
.links a.lk:hover{border-color:var(--acc)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;transition:.3s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (max-width:900px){
  .app{flex-direction:column}
  aside{width:100%;height:auto;position:fixed;bottom:0;top:auto;z-index:40;padding:6px 6px;flex-direction:row}
  .brand,.side-foot{display:none}
  nav{display:flex;overflow-x:auto;gap:2px;width:100%}
  nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;min-width:64px;text-align:center}
  nav a.on{box-shadow:none}
  main{padding:18px 14px 110px}
  .g2,.g3,.g4,.gmain,.gplan{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  h1{font-size:26px}.hero .date{font-size:23px}
  .chat{height:calc(100vh - 260px)}
}
</style>
</head>

mary undertake", "5": "academy adjust alter amend aware capacity challenge clause compound conflict consult contact decline discrete draft enable energy enforce entity equivalent evolve expand expose external facilitate fundamental generate generation image liberal licence logic margin medical mental modify monitor network notion objective orient perspective precise prime psychology pursue ratio reject revenue stable style substitute sustain symbol target transit trend version welfare whereas", "6": "abstract accurate acknowledge aggregate allocate assign attach author bond brief capable cite cooperate discriminate display diverse domain edit enhance estate exceed expert explicit federal fee flexible furthermore gender ignorance incentive incidence incorporate index inhibit initiate input instruct intelligence interval lecture migrate minimum ministry motive neutral nevertheless overseas precede presume rational recover reveal scope subsidy tape trace transform transport underlie utilise", "7": "adapt adult advocate aid channel chemical classic comprehensive comprise confirm contrary convert couple decade definite deny differentiate dispose dynamic eliminate empirical equip extract file finite foundation globe grade guarantee hierarchy identical ideology infer innovate insert intervene isolate media mode paradigm phenomenon priority prohibit publication quote release reverse simulate sole somewhat submit successor survive thesis topic transmit ultimate unique visible voluntary"};

ive thrive trivial ubiquitous undermine underscore unprecedented uphold validate venerate versatile viable vigilant vindicate volatile vulnerable warrant wary yield zealous";
const UNITDAY={}, DAYUNIT={}, ALLWORDS=[];
{const seen=new Set();for(const s of [1,2,3,4,5,6,7])for(const w of AWL[s].split(" ")){if(!seen.has(w)){seen.add(w);ALLWORDS.push({w,s:"AWL "+s})}}
 for(const w of SATW.split(" "))if(!seen.has(w)){seen.add(w);ALLWORDS.push({w,s:"SAT"})}}
const NWORDS=ALLWORDS.length;
{let prev="2026-11-16",lo=1;for(const [m,x] of DUE){const nd=diff(prev,x),nu=m-lo+1;for(let k=0;k<nu;k++){const u=lo+k,d=addD(prev,1+Math.floor(k*nd/nu));UNITDAY[u]=d;DAYUNIT[d]=u}prev=x;lo=m+1}}
const topicOf=u=>GROUPS.find(g=>u>=g[0]&&u<=g[1])[2];
const phaseOf=k=>PHASES.find(p=>k>=p.from&&k<=p.to)||PHASES[0];
function reading(k){const m=parse(k).getMonth(),wd=wdOf(k);
  if(m===10||m===11)return wd%2===0?{t:"News in Levels: 1 статья (уровень 2–3)",u:L.NIL}:{t:"BBC Learning English: 1 статья или урок",u:L.BBC};
  if(m===0||m===1)return{t:"Newsela: 1 статья (уровень чуть выше комфортного)",u:L.NEWSELA};
  if(m>=2&&m<=4)return [{t:"National Geographic: 1 статья",u:L.NG},{t:"Smithsonian Magazine: 1 статья",u:L.SM},{t:"Science News Explores: 1 статья",u:L.SNE}][wd%3];
  if(m===5)return{t:"Книга июня (Wonder или Holes): 1–2 главы",u:"#links"};
  if(m===6)return{t:"Книга июля (The Giver): 1–2 главы",u:"#links"};
  return{t:"Книга августа (Animal Farm или Of Mice and Men): 1–2 главы",u:"#links"}}
function extra(k){if(SPECIAL[k])return SPECIAL[k];const m=parse(k).getMonth(),wd=wdOf(k);
  if(wd===6)return(m===10||m===11)?"Итоги недели: посмотри календарь и статистику":"Напиши пересказ (3–4 предложения) одной статьи или главы";
  if(m===6&&wd===5)return"Khan Academy: 5–10 лёгких вопросов SAT Reading & Writing";
  if(m>=2&&m<=7&&(wd===1||wd===3))return"Посмотри 1 видео TED-Ed или Kurzgesagt (с английскими субтитрами)";
  return""}
let loaded=false;
function wpd(){return (S.settings&&S.settings.wpd)||8}
function assignedSet(){const a=new Set();for(const k in S.dw)for(const w of S.dw[k])a.add(w);return a}
function wqueue(){const a=assignedSet();return ALLWORDS.filter(x=>!a.has(x.w)&&(S.vocab[x.w]||0)!==2).map(x=>x.w)}
function wordsFor(k){if(S.dw[k])return S.dw[k];if(k<TODAY)return[];
  const q=wqueue(),n=wpd();
  if(k===TODAY){const ws=q.slice(0,n);if(loaded&&ws.length){S.dw=Object.assign({},S.dw,{[k]:ws});save("progress")}return ws}
  const off=(S.dw[TODAY]?0:n)+(diff(TODAY,k)-1)*n;return q.slice(off,off+n)}
function dayOfWord(w){for(const k in S.dw)if(S.dw[k].includes(w))return k;return null}
function replaceDayWords(k){const ws=S.dw[k]||[];const v=Object.assign({},S.vocab);ws.forEach(w=>v[w]=2);S.vocab=v;save("vocab");const dw=Object.assign({},S.dw);delete dw[k];S.dw=dw;wordsFor(k);save("progress");render();toast("Отмечены как «Знаю» — вот новые слова")}
function dayPlan(k){const r=reading(k),words=wordsFor(k),unit=DAYUNIT[k],x=extra(k),hw=wdOf(k)!==6;
  const tasks=[{id:"r",ico:"📖",bg:"#EEF0FF",lbl:"Чтение · 30 мин",txt:"Статья дня с вопросами — или "+r.t.charAt(0).toLowerCase()+r.t.slice(1),url:r.u},
   {id:"w",ico:"🔤",bg:"#FFF4E0",lbl:"Слова · "+words.length+" новых",txt:words.length?"Выучи "+words.length+" новых слов + повтори карточки":"Повтори свои карточки (10 мин)",words}];
  if(unit)tasks.push({id:"g",ico:"✏️",bg:"#E6FCF3",lbl:"Грамматика",txt:"Murphy, юнит "+unit+" · "+topicOf(unit),unit});
  if(hw)tasks.push({id:"h",ico:"🧠",bg:"#F3E8FF",lbl:"Домашка с ИИ",txt:"Мини-домашка: слова, грамматика, SAT-текст, письмо"});
  if(x)tasks.push({id:"x",ico:x.includes("ЧЕКПОИНТ")||x.includes("ФИНАЛ")?"🏁":"⭐",bg:"#FFE8EC",lbl:"Дополнительно",txt:x});
  return{k,phase:phaseOf(k),tasks,words,unit}}

// ================= STATE / STORAGE =================
const S={days:{},books:{},tests:[],vocab:{},explain:{},hw:{},art:{},chat:[],dw:{},settings:{}};
const DOCS={progress:["days","books","tests","dw","settings"],vocab:["vocab"],explain:["explain"],chat:["chat"]};
let db=null,uid=null,sample=null,mode="loading";
const LS="satEng.";
function lsGet(n){try{return JSON.parse(localStorage.getItem(LS+n)||"null")}catch(e){return null}}
function lsSet(n,v){try{localStorage.setItem(LS+n,JSON.stringify(v))}catch(e){}}
function docBody(n){const o={};for(const f of DOCS[n])o[f]=S[f];return o}
function hwDocName(k){return "hw-"+k.slice(0,7)}
function hwBody(name){const m=name.slice(3),o={};for(const k in S.hw)if(k.startsWith(m))o[k]=S.hw[k];return{hw:o}}
function artBody(name){const m=name.slice(4),o={};for(const k in S.art)if(k.startsWith(m))o[k]=S.art[k];return{art:o}}
function artDocName(k){return "art-"+k.slice(0,7)}
const dirty=new Set(),writing=new Set();let saveT=null;
function save(n){dirty.add(n);clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){for(const n of [...dirty]){if(writing.has(n))continue;dirty.delete(n);
  const body=n.startsWith("hw-")?hwBody(n):n.startsWith("art-")?artBody(n):docBody(n);lsSet(n,body);
  if(db&&uid&&loaded){writing.add(n);try{await db.collection("data/users/"+uid).doc(n).set(body)}catch(e){console.warn("save",n,e);if(e&&e.code==="invalid_argument"){setSync("loc")}}writing.delete(n);if(dirty.has(n))flush()}}}
function applyBody(n,b){if(!b)return;if(n.startsWith("hw-")){Object.assign(S.hw,b.hw||{});return}if(n.startsWith("art-")){Object.assign(S.art,b.art||{});return}for(const f of DOCS[n])if(b[f]!==undefined)S[f]=b[f]}
function loadLocal(){for(const n in DOCS)applyBody(n,lsGet(n));
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith(LS+"hw-")||k.startsWith(LS+"art-")))applyBody(k.slice(LS.length),lsGet(k.slice(LS.length)))}}
function setSync(m){mode=m;if(m!=="loading"&&!loaded){loaded=true;setTimeout(()=>{render();flush()},0)}const d=document.getElementById("syncdot"),t=document.getElementById("synctxt");
  d.className="dot "+(m==="cloud"?"ok":m==="loc"?"loc":"");t.textContent=m==="cloud"?"Прогресс сохраняется в облаке":m==="loc"?"Сохраняется только в этом браузере":"Загрузка…"}
async function initCloud(){
  const c=window.claude;if(!c||!c.use){setSync("loc");return}
  c.use("sample").then(s=>{sample=s;render()}).catch(()=>{});
  try{const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
    if(!d||!u){setSync("loc");return}
    const id=await u.id();if(!id){setSync("loc");return}
    db=d;uid=id;const col=db.collection("data/users/"+uid);
    const names=Object.keys(DOCS);const months=[];for(let k=START.slice(0,7)+"-01";k<=END;k=addD(k,32).slice(0,7)+"-01"){months.push("hw-"+k.slice(0,7));months.push("art-"+k.slice(0,7))}
    const tm=setTimeout(()=>setSync("loc"),10000);
    const snaps=await Promise.all([...names,...months].map(n=>col.doc(n).get().then(s=>[n,s]).catch(()=>[n,null])));
    clearTimeout(tm);
    let any=false;for(const [n,s] of snaps){if(s&&s.exists){any=true;applyBody(n,JSON.parse(JSON.stringify(s.data())))}}
    if(!any){ // first cloud visit: push local data up
      for(const n of names)if(lsGet(n))save(n);for(const k in S.hw)save(hwDocName(k));for(const k in S.art)save(artDocName(k))}
    setSync("cloud");render()}
  catch(e){console.warn(e);setSync("loc")}}

// ================= PROGRESS =================
function dayState(k){return S.days[k]||{}}
function prog(k){const p=dayPlan(k),st=dayState(k);const done=p.tasks.filter(t=>st[t.id]).length;return{done,total:p.tasks.length,pct:p.tasks.length?done/p.tasks.length:0}}
function streak(){let k=prog(TODAY).pct===1?TODAY:addD(TODAY,-1),n=0;while(k>=START&&prog(k).pct===1){n++;k=addD(k,-1)}return n}
function perfectDays(){return Object.keys(S.days).filter(k=>k>=START&&k<=END&&prog(k).pct===1).length}
function totalMin(){return Object.values(S.days).reduce((a,d)=>a+(+d.min||0),0)}
function wordsKnown(){return Object.values(S.vocab).filter(v=>v===2).length}
function unitsDone(){let n=0;for(let u=1;u<=145;u++)if(dayState(UNITDAY[u]).g)n++;return n}
function toggle(k,id){const d=Object.assign({},S.days[k]||{});const before=prog(k).pct;d[id]=d[id]?0:1;S.days[k]=d;save("progress");
  const after=prog(k).pct;render();if(after===1&&before<1){confetti();toast("🎉 День выполнен на 100%!")}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(t){const lines=esc(t).split(/\n/);let h="",list=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  for(const ln of lines){const ul=ln.match(/^\s*[-*•]\s+(.*)/),ol=ln.match(/^\s*\d+[.)]\s+(.*)/),hd=ln.match(/^#{1,4}\s+(.*)/);
    if(ul||ol){const tg=ul?"ul":"ol";if(list!==tg){if(list)h+="</"+list+">";h+="<"+tg+">";list=tg}h+="<li>"+inl((ul||ol)[1])+"</li>";continue}
    if(list){h+="</"+list+">";list=null}
    if(hd)h+="<h4>"+inl(hd[1])+"</h4>";else if(ln.trim())h+="<p>"+inl(ln)+"</p>"}
  if(list)h+="</"+list+">";return h}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function openModal(h){$("#modalBody").innerHTML=h;$("#modal").classList.add("on")}

$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function ringSVG(p,size=38){const r=15,c=2*Math.PI*r;const col=p>=1?"#12B886":p>=.5?"#F59F00":p>0?"#E8590C":"#D5DBE7";
  return `<svg class="ring" viewBox="0 0 38 38" width="${size}" height="${size}"><circle cx="19" cy="19" r="${r}" fill="none" stroke="#EEF1F6" stroke-width="5"/><circle cx="19" cy="19" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 19 19)"/>${p>=1?'<text x="19" y="23.5" text-anchor="middle" font-size="12" fill="#12B886">✓</text>':""}</svg>`}
function confetti(){const cv=$("#cf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;const cols=["#5B5BF0","#7C4DFF","#12B886","#F59F00","#FF6B9A"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;
  (function step(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,cv.width,cv.height)})()}
async function ask(prompt,opts={}){if(!sample)throw{code:"no_ai"};return sample(prompt,Object.assign({cache:false},opts))}

// ================= VIEW: TODAY =================
function vToday(){const k=SEL,p=dayPlan(k),st=dayState(k),pr=prog(k);const n=diff(START,k)+1,tot=diff(START,END)+1;
  const msg=pr.pct===1?"🎉 Всё сделано — отличная работа!":pr.pct>=.5?"💪 Больше половины — дожми!":pr.pct>0?"👍 Хорошее начало, продолжай!":"🚀 Начнём! Нужно всего около 45 минут.";
  const isToday=k===TODAY;
  let h=`<div class="card hero"><div class="top"><div><div class="pill">${isToday?"СЕГОДНЯ":k<TODAY?"ПРОШЕДШИЙ ДЕНЬ":"БУДУЩИЙ ДЕНЬ"} · ${esc(p.phase.name)}</div><div class="date">${esc(fmtLong(k))}</div><div class="msg">День ${n} из ${tot}</div></div>
   <div class="daynav"><button onclick="go(addD(SEL,-1))">←</button>${isToday?"":`<button onclick="go(TODAY)">Сегодня</button>`}<button onclick="go(addD(SEL,1))">→</button></div></div>
   <div class="bar"><i style="width:${pr.pct*100}%"></i></div>
   <div class="meta"><span>${pr.done} из ${pr.total} задач</span><span>${Math.round(pr.pct*100)}%</span></div><div class="msg">${msg}</div></div>`;
  h+=`<div class="stats"><div class="stat"><b>🔥 ${streak()}</b><span>дней подряд</span></div><div class="stat"><b>✅ ${perfectDays()}</b><span>идеальных дней</span></div><div class="stat"><b>⏱ ${totalMin()}</b><span>минут чтения</span></div><div class="stat"><b>🔤 ${wordsKnown()}</b><span>слов знаю из ${NWORDS}</span></div><div class="stat"><b>✏️ ${unitsDone()}</b><span>юнитов из 145</span></div></div>`;
  h+=`<div class="grid gmain"><div><h2>Задачи на день</h2>`;
  for(const t of p.tasks){const d=!!st[t.id];let extraH="";
    if(t.id==="r")extraH=`<div class="toolbar" style="margin:0"><a class="btn s" href="#article">📰 Статья дня с вопросами</a><a class="btn s ghost" href="${esc(t.url)}" ${t.url.startsWith("#")?"":'target="_blank" rel="noopener"'}>Открыть ↗</a><label class="mini">Минут: <input type="number" min="0" max="600" style="width:76px" value="${st.min||""}" onchange="setMin('${k}',this.value)"></label></div>`;
    if(t.id==="w"&&t.words.length)extraH=`<div class="chips">${t.words.map(w=>{const v=S.vocab[w]||0;return`<button class="chip" style="${v===2?"background:#D3F9E8;border-color:#B2F2D4":v===1?"background:#FFF3BF;border-color:#FFE066":""}" onclick="wordModal('${w}')">${w} ›</button>`}).join("")}</div>${k===TODAY&&S.dw[k]?`<button class="btn s ghost" style="margin-top:8px" onclick="replaceDayWords('${k}')">🔁 Я знаю эти слова — дай другие</button>`:""}`;
    if(t.id==="g")extraH=`<button class="btn s ghost" onclick="grammarModal(${t.unit})">🤖 Объяснить тему · задать вопрос</button>`;
    if(t.id==="h"){const hw=S.hw[k];extraH=hw&&hw.score!=null?`<span class="pill g">Результат: ${hw.score}/${hw.max}</span> <a class="btn s ghost" href="#homework">Открыть</a>`:`<a class="btn s" href="#homework">Сделать домашку →</a>`}
    h+=`<div class="task ${d?"done":""}"><div class="ico" style="background:${t.bg}">${t.ico}</div><div class="body"><div class="lbl">${esc(t.lbl)}</div><div class="txt">${esc(t.txt)}</div>${extraH}</div><button class="chk" title="Отметить" onclick="toggle('${k}','${t.id}')">✓</button></div>`}
  h+=`</div><div><h2>Неделя</h2><div class="week">`;
  const mon=addD(k,-wdOf(k));for(let i=0;i<7;i++){const d=addD(mon,i),inP=d>=START&&d<=END,pp=inP?prog(d).pct:0;
    h+=`<div class="wd ${d===k?"sel":""}" onclick="${inP?`go('${d}')`:""}"><small>${RU_D[i]}</small><b>${parse(d).getDate()}</b>${inP?ringSVG(pp):'<div style="height:44px"></div>'}</div>`}
  h+=`</div><div class="card" style="margin-top:16px"><h3>Завтра</h3>`;
  const tk=addD(k,1);if(tk<=END){const tp=dayPlan(tk);h+=tp.tasks.map(t=>`<div class="mini" style="margin-bottom:4px">${t.ico} ${esc(t.txt)}</div>`).join("")}else h+=`<div class="mini">План закончен — ты молодец! 🎓</div>`;
  h+=`</div><div class="card" style="margin-top:16px"><h3>Этап: ${esc(p.phase.name)}</h3><div class="mini">${esc(p.phase.goal)}</div>`;
  const ph=p.phase,phDays=diff(ph.from,ph.to)+1;let phDone=0;for(let d=ph.from;d<=ph.to;d=addD(d,1))phDone+=prog(d).pct;

function setMin(k,v){const d=Object.assign({},S.days[k]||{});d.min=Math.max(0,Math.min(600,+v||0));S.days[k]=d;save("progress");if(d.min>=20&&!d.r){d.r=1;S.days[k]=d;render();toast("📖 Чтение отмечено")}}

// ================= VIEW: PLAN =================
function vPlan(){let h=`<h1>План на год</h1><p class="sub">Каждый квадратик — день. Нажми на день, чтобы открыть его задачи.</p>
  <div class="legend"><span><i style="background:#EEF1F6"></i>не начат</span><span><i style="background:#FFD8A8"></i>частично</span><span><i style="background:#B2F2D4"></i>почти</span><span><i style="background:#12B886"></i>100%</span><span><i style="background:#FFE3E3"></i>пропущен</span><span><i style="box-shadow:inset 0 0 0 2px #7C4DFF;background:#fff"></i>чекпоинт</span></div>`;
  h+=`<div class="grid gplan"><div class="cal">`;
  let m=START.slice(0,7)+"-01";while(m<=END){const d0=parse(m);const name=d0.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});

const TUTOR_SYS=`You are "Coach", a warm, encouraging SAT English tutor for a 9th-grade student. Their English is B1+, native language Russian; they have about 3 years until the SAT and are working on the Reading & Writing section (vocabulary from the Academic Word List, grammar from Murphy's English Grammar in Use, reading academic texts). Rules: reply in the language the student writes in (usually Russian), but give examples and SAT-style practice in English. Keep answers short and clear (under 180 words) unless asked for more. When giving practice questions, give 4 options (A–D) and wait for the student's answer before revealing it. When correcting writing, show the corrected version and explain the 2–3 key rules. Use simple words. Be positive.`;
function chatMsgs(hist){const ms=hist.slice(-20).filter(m=>m.t).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
  while(ms.length&&ms[0].role!=="user")ms.shift();if(ms.length)ms[0]={role:"user",content:TUTOR_SYS+"\n\nStudent context: today is "+TODAY+"; today's words: "+(S.dw[TODAY]||[]).join(", ")+"; current grammar topic: "+hwContext(clampKey(TODAY)).topic+".\n\n---\n\n"+ms[0].content};return ms}
async function sendChat(text){text=(text||"").trim();if(!text||chatBusy)return;if(!sample){toast("ИИ недоступен в этом просмотре");return}
  S.chat=[...S.chat,{r:"u",t:text}];const msgs=chatMsgs(S.chat);const ai={r:"a",t:""};S.chat.push(ai);chatBusy=true;render();scrollChat();
  chatAbort=new AbortController();
  try{const r=await sample(msgs,{cache:false,signal:chatAbort.signal,onText:({text})=>{ai.t=text;const el=$("#lastAi");if(el){el.innerHTML=md(text);scrollChat()}}});ai.t=r.text}
  catch(e){ai.t=ai.t||"⚠️ "+aiErr(e)}
  chatBusy=false;S.chat=S.chat.slice(-60);save("chat");render();scrollChat()}
function scrollChat(){const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight}
function vTutor(){const sug=["Объясни разницу между however и therefore","Дай мне 3 SAT-вопроса на transitions",`Проверь предложение со словом «${(S.dw[TODAY]||["analyse"])[0]}»`,"Как быстрее читать длинные тексты?","Объясни Present Perfect простыми словами","Дай короткий текст и вопрос на главную мысль"];
  let h=`<h1>ИИ-репетитор</h1><p class="sub">Спрашивай что угодно про английский и SAT — по-русски или по-английски.${sample?"":" ⚠️ "+aiErr({code:"no_ai"})}</p><div class="card chat"><div class="msgs" id="msgs">`;
  if(!S.chat.length)h+=`<div class="empty"><div style="font-size:46px">🤖</div><b>Привет! Я твой репетитор по SAT English.</b><p class="mini">Могу объяснить грамматику, проверить текст, дать тренировочные вопросы или разобрать слово.</p></div>`;
  S.chat.forEach((m,i)=>{const last=i===S.chat.length-1&&m.r==="a";h+=`<div class="m ${m.r}" ${last?'id="lastAi"':""}>${m.r==="a"?(m.t?md(m.t):'<span class="spin"></span>'):esc(m.t).replace(/\n/g,"<br>")}</div>`});
  h+=`</div><div class="sugs">${sug.map(s=>`<button class="chip" onclick="sendChat(this.textContent)">${esc(s)}</button>`).join("")}</div>
  <div class="composer"><textarea id="chatIn" placeholder="Напиши сообщение…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();const v=this.value;this.value='';sendChat(v)}"></textarea><button class="btn" ${chatBusy||!sample?"disabled":""} onclick="const i=$('#chatIn');const v=i.value;i.value='';sendChat(v)">➤</button>
  ${S.chat.length&&!chatBusy?`<button class="btn ghost" title="Очистить" onclick="S.chat=[];save('chat');render()">🗑</button>`:""}</div></div>`;
  $("#main").innerHTML=h;scrollChat()}

// ================= LINKS =================
function setBook(t,v){S.books=Object.assign({},S.books,{[t]:v});save("progress");render()}
function vLinks(){const sec=(title,items)=>`<div class="card links"><h2>${title}</h2>${items.map(([n,d,u])=>`<a class="lk" href="${u}" target="_blank" rel="noopener"><span><b>${n}</b><br><span class="mini">${d}</span></span><span>↗</span></a>`).join("")}</div>`;
  let h=`<h1>Ресурсы</h1><p class="sub">Всё, что нужно для подготовки, — бесплатно.</p><div class="grid g2" style="align-items:start">`;
  h+=sec("📖 Читать и смотреть",[["News in Levels","Новости на 3 уровнях · ноябрь–декабрь",L.NIL],["BBC Learning English","Уроки и статьи · ноябрь–декабрь",L.BBC],["Newsela","Новости разной сложности · январь–февраль",L.NEWSELA],["National Geographic","Наука, природа, история · с марта",L.NG],["Smithsonian Magazine","История и культура · с марта",L.SM],["Science News Explores","Наука для подростков · с марта",L.SNE],["TED-Ed","Короткие анимированные уроки",L.TED],["Kurzgesagt","Наука в анимации (YouTube)",L.KURZ]]);
  h+=sec("🎯 SAT и инструменты",[["Bluebook","Официальные пробные тесты SAT",L.BB],["Khan Academy — Digital SAT","Бесплатная официальная подготовка",L.KHAN],["SAT Question Bank","Официальные вопросы по типам (с 10 класса)",L.QB],["Anki","Карточки с интервальным повторением",L.ANKI],["Quizlet","Карточки — простая альтернатива",L.QUIZ],["Academic Word List","Официальный список AWL",L.AWLS],["Cambridge Dictionary","Значения и примеры",L.CAM.replace(/dictionary\/english\/$/,"")],["English Grammar in Use","Найти учебник Murphy",L.MUR]]);
  h+=`<div class="card"><h2>📚 Книги на лето (цель — 3)</h2><table class="wtable">${BOOKS.map(([t,a,lv,m])=>{const st=S.books[t]||0;return`<tr><td><b>${t}</b><br><span class="mini">${a} · ${lv} · ${m}</span></td><td><a class="mini" href="https://openlibrary.org/search?q=${encodeURIComponent(t+" "+a)}" target="_blank" rel="noopener">Найти ↗</a></td><td><button class="st st${st}" onclick="setBook('${t}',${(st+1)%3})">${["Не начата","Читаю","Прочитана"][st]}</button></td></tr>`}).join("")}</table></div>`;
  h+=sec("🏛 Бонус на 10 класс — классика бесплатно",[["Pride and Prejudice","Jane Austen","https://www.gutenberg.org/ebooks/1342"],["Frankenstein","Mary Shelley","https://www.gutenberg.org/ebooks/84"],["Jane Eyre","Charlotte Brontë","https://www.gutenberg.org/ebooks/1260"],["Great Expectations","Charles Dickens","https://www.gutenberg.org/ebooks/1400"]]);
  $("#main").innerHTML=h+`</div>`}

loadLocal();setSync("loading");render();initCloud();
</script>
